server:
  port: 8082
  http2:
    enabled: false

other-agents:
  a2a:
    public-url: http://localhost:8082
  mcp:
    endpoints:
      test1:
        path: /test1/mcp
        token: ${MCP_TEST1_TOKEN:dev-token-test1}
      test2:
        path: /test2/mcp
        token: ${MCP_TEST2_TOKEN:dev-token-test2}

spring:
  application:
    name: other-agents
  ai:
    mcp:
      server:
        # 关闭 Spring AI 单端点自动装配，改用 McpEndpointConfig 手工装配多 endpoint（见 docs/adr/0004）
        enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/h_agent_db
    username: h_agent
    password: h_agent
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
chat:
  stream:
    heartbeat-interval: 15s
    max-concurrent-per-user: 2
    max-concurrent-global: 100
    permit-ttl: 10m
  resources:
    upload:
      allowed-mime-types: image/jpeg,image/png,image/webp,video/mp4,audio/mpeg,audio/mp4,audio/wav,audio/webm
      max-file-size: 10485760
