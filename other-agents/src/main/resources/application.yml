server:
  port: ${SERVER_PORT:8082}
  http2:
    enabled: false

logging:
  pattern:
    correlation: "[TraceId:%X{traceId:--}] [SpanId:%X{spanId:--}] "

other-agents:
  a2a:
    public-url: ${OTHER_AGENTS_A2A_PUBLIC_URL:}
    version: ${OTHER_AGENTS_A2A_VERSION:0.1.0}
    story:
      enabled: ${A2A_STORY_ENABLED:false}
      review-enabled: ${A2A_STORY_REVIEW_ENABLED:true}
      fact-check-enabled: ${A2A_STORY_FACT_CHECK_ENABLED:true}
      signing-key: ${A2A_STORY_SIGNING_KEY:}
    documents:
      enabled: ${A2A_DOCUMENTS_ENABLED:false}
      callback-url: ${A2A_DOCUMENT_CALLBACK_URL:}
  mcp:
    endpoints:
      test1:
        version: ${MCP_TEST1_VERSION:0.0.1}
        path: /test1/mcp
        token: ${MCP_TEST1_TOKEN:dev-token-test1}
      test2:
        version: ${MCP_TEST2_VERSION:0.0.1}
        path: /test2/mcp
        token: ${MCP_TEST2_TOKEN:dev-token-test2}

spring:
  application:
    name: other-agents
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  ai:
    mcp:
      server:
        # 关闭 Spring AI 单端点自动装配，改用 McpEndpointConfig 手工装配多 endpoint（见 docs/adr/0004）
        enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/h_agent_db}
    username: ${DB_USERNAME:h_agent}
    password: ${DB_PASSWORD:h_agent}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    # 独立目录：避免扫到依赖 jar（如 backend）内 db/migration 的迁移脚本
    locations: classpath:db/team-migration,classpath:db/a2a-migration
    # Isolate this service from backend's public.flyway_schema_history in a shared database.
    default-schema: other_agents
    schemas: other_agents
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
chat:
  documents:
    # 共享 chat_document_tasks 任务表的归属标识，backend 只领取 owner=backend 的任务。
    owner: other-agents
    modelbest-api-key: ${MODELBEST_API_KEY:}
  stream:
    heartbeat-interval: 15s
    max-concurrent-per-user: 2
    max-concurrent-global: 100
    permit-ttl: 10m
  resources:
    upload:
      allowed-mime-types: image/jpeg,image/png,image/webp,video/mp4,audio/mpeg,audio/mp4,audio/wav,audio/webm
      max-file-size: 10485760
  filesystem:
    base-dir: /tmp/h-agent/assistant-files
    max-file-size-bytes: 10485760
  shell:
    enabled: true
    default-timeout-seconds: 30
    max-timeout-seconds: 120
    max-output-bytes: 100000
    inherit-environment: false

# 以下配置块与 backend 对齐（agent-capabilities 共享模块），凭据均来自仓库根 .env。
resource-storage:
  absolute-max-bytes: 524288000
  minio:
    endpoint: ${MINIO_ENDPOINT:http://169.254.210.181:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_RESOURCES_BUCKET:}
    object-prefix: ${MINIO_RESOURCES_PREFIX:h-agent/}
    connect-timeout: 3s
    read-timeout: 60s
    part-size-bytes: 10485760

image-generation:
  minimax:
    base-url: ${IMAGE_BASE_URL:https://api.minimaxi.com}
    api-key: ${IMAGE_API_KEY:${MINIMAX_API_KEY:${API_KEY:}}}
    model: ${IMAGE_MODEL_NAME:image-01}
    aspect-ratio: ${IMAGE_ASPECT_RATIO:1:1}
    prompt-optimizer: ${IMAGE_PROMPT_OPTIMIZER:true}
    n: ${IMAGE_COUNT:1}
    request-timeout-seconds: ${IMAGE_REQUEST_TIMEOUT_SECONDS:180}

generation:
  # 共享 generation_tasks 任务表的归属标识，backend 只领取 owner=backend 的任务。
  owner: other-agents
  polling:
    fixed-delay: 5s
    batch-size: 20
    queueing-delay: 10s
    processing-delay: 15s
    retry-delay: 30s
  minimax:
    base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com}
    api-key: ${MINIMAX_API_KEY:${API_KEY:}}
    video-v2-base-url: ${MINIMAX_VIDEO_V2_BASE_URL:}
    default-video-model: ${MINIMAX_VIDEO_MODEL:MiniMax-H3}
    ffprobe-path: ${MINIMAX_FFPROBE_PATH:ffprobe}
    regeneration-task-id-enabled: ${MINIMAX_REGENERATION_TASK_ID_ENABLED:false}
  download:
    max-file-size: 524288000

skill-platform:
  nacos:
    server-addr: ${NACOS_SKILLS_SERVER_ADDR:${NACOS_SERVER_ADDR:169.254.210.181:8848}}
    namespace: ${NACOS_SKILLS_NAMESPACE:${NACOS_NAMESPACE:bc2a5f7e-0ab7-452c-849c-13527706651f}}
    username: ${NACOS_SKILLS_USERNAME:${NACOS_USERNAME:}}
    password: ${NACOS_SKILLS_PASSWORD:${NACOS_PASSWORD:}}
    name-prefix: h-agent-skill-
  repository:
    provider: nacos
    clone-url: https://gitee.com/huajiangliangliang/hj-skill-repo.git
    branch: master
    credential-env: GITEE_TOKEN
    api-base-url: https://gitee.com/api/v5
  artifacts:
    endpoint: ${MINIO_ENDPOINT:http://169.254.210.181:9000}
    access-key: ${MINIO_SKILLS_ACCESS_KEY:${MINIO_ACCESS_KEY:}}
    secret-key: ${MINIO_SKILLS_SECRET_KEY:${MINIO_SECRET_KEY:}}
    system-bucket: ${MINIO_SYSTEM_SKILLS_BUCKET:h-agent-skills}
    user-bucket: ${MINIO_USER_SKILLS_BUCKET:h-agent-skills}
    system-object-prefix: ${MINIO_SYSTEM_SKILLS_PREFIX:system/}
    user-object-prefix: ${MINIO_USER_SKILLS_PREFIX:user/}
    connect-timeout: 3s
    read-timeout: 60s
  validation:
    max-user-skills: 20
    max-file-bytes: 1048576
    max-total-bytes: 10485760
    max-files: 200
    max-depth: 8
  cache:
    directory: /tmp/h-agent/skill-artifacts
    max-bytes: 524288000
    snapshot-ttl: 5m
  runtime:
    enabled: true

memory:
  long-term:
    enabled: true
    mem0:
      base-url: ${MEM0_BASE_URL:http://169.254.210.181:8888}
      api-key: ${MEM0_API_KEY:}
      contract-version: ${MEM0_CONTRACT_VERSION:}
      openapi-sha256: ${MEM0_OPENAPI_SHA256:}
      connect-timeout: 5s
    recall:
      response-timeout: 10s
      max-attempts: 1
      top-k-per-scope: 4
      max-total-results: 8
      max-chars: 6000
      circuit-breaker-enabled: true
    capture:
      outbox-enabled: true
      max-attempts: 10
      initial-delay: 5s
      max-delay: 15m
      multiplier: 2.0
      jitter: 0.2
    explicit-mutation:
      response-timeout: 3s
      max-attempts: 2

knowledge:
  retriever:
    max-results: 4
    min-score: 0.6
  split:
    chunk-size: 300
    chunk-overlap: 30
  upload:
    allowed-types:
      - md
      - markdown
      - txt
      - doc
      - docx
      - xls
      - xlsx

# Shared Nacos naming client. Registration is mandatory on normal web application startup.
h-agent:
  registry:
    enabled: ${NACOS_ENABLED:true}
    a2a-enabled: ${NACOS_A2A_ENABLED:true}
    mcp-enabled: ${NACOS_MCP_ENABLED:true}
    server-addr: ${NACOS_SERVER_ADDR:169.254.210.181:8848}
    namespace: ${NACOS_NAMESPACE:bc2a5f7e-0ab7-452c-849c-13527706651f}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
    cluster: ${NACOS_CLUSTER:DEFAULT}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    ip: ${NACOS_IP:}
    port: ${NACOS_PORT:0}
    timeout-ms: ${NACOS_TIMEOUT_MS:5000}
