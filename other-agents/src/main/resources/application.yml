server:
  port: ${SERVER_PORT:8082}
  http2:
    enabled: false

logging:
  pattern:
    correlation: "[TraceId:%X{traceId:--}] [SpanId:%X{spanId:--}] "

other-agents:
  a2a:
    public-url: ${OTHER_AGENTS_A2A_PUBLIC_URL:}
    version: ${OTHER_AGENTS_A2A_VERSION:0.1.0}
  mcp:
    endpoints:
      test1:
        path: /test1/mcp
        token: ${MCP_TEST1_TOKEN:dev-token-test1}
      test2:
        path: /test2/mcp
        token: ${MCP_TEST2_TOKEN:dev-token-test2}

spring:
  application:
    name: other-agents
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  ai:
    mcp:
      server:
        # 关闭 Spring AI 单端点自动装配，改用 McpEndpointConfig 手工装配多 endpoint（见 docs/adr/0004）
        enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/h_agent_db}
    username: ${DB_USERNAME:h_agent}
    password: ${DB_PASSWORD:h_agent}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Isolate this service from backend's public.flyway_schema_history in a shared database.
    default-schema: other_agents
    schemas: other_agents
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
chat:
  stream:
    heartbeat-interval: 15s
    max-concurrent-per-user: 2
    max-concurrent-global: 100
    permit-ttl: 10m
  resources:
    upload:
      allowed-mime-types: image/jpeg,image/png,image/webp,video/mp4,audio/mpeg,audio/mp4,audio/wav,audio/webm
      max-file-size: 10485760

# Shared Nacos naming client. Registration is mandatory on normal web application startup.
h-agent:
  registry:
    enabled: ${NACOS_ENABLED:true}
    a2a-enabled: ${NACOS_A2A_ENABLED:true}
    server-addr: ${NACOS_SERVER_ADDR:169.254.210.181:8848}
    namespace: ${NACOS_NAMESPACE:bc2a5f7e-0ab7-452c-849c-13527706651f}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
    cluster: ${NACOS_CLUSTER:DEFAULT}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    ip: ${NACOS_IP:}
    port: ${NACOS_PORT:0}
    timeout-ms: ${NACOS_TIMEOUT_MS:5000}
