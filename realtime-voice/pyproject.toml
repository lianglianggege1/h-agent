[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h-agent-realtime-voice"
version = "0.1.0"
description = "Realtime voice conversation service for h-agent"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi~=0.141.0",
    "httpx~=0.28.0",
    "langchain~=1.3.0",
    "langchain-openai~=1.4.0",
    "langgraph~=1.2.0",
    "livekit-agents[langchain,silero]~=1.6.9",
    "python-dotenv~=1.2.0",
    "uvicorn[standard]~=0.52.0",
]

[dependency-groups]
dev = [
    "pytest~=9.0.0",
    "pytest-asyncio~=1.3.0",
    "ruff~=0.15.0",
]

[project.scripts]
realtime-voice = "realtime_voice.agent:main"
realtime-voice-api = "realtime_voice.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001"]
