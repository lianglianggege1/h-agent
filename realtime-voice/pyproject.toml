[project]
name = "h-agent-realtime-voice"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents==1.6.9",
  "livekit-plugins-silero==1.6.9",
  "httpx>=0.28,<0.29",
  "aiohttp>=3.12,<4",
  "python-dotenv>=1.1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/realtime_voice"]
[project.scripts]
voice-worker = "realtime_voice.worker:main"
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff.lint]
extend-ignore = ["BLE001"]
[tool.ruff.lint.per-file-ignores]
"src/realtime_voice/providers/*.py" = ["S110", "TRY004", "TRY301", "PLR1730", "RUF046"]
