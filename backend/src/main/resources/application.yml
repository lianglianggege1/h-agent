server:
  http2:
    enabled: true

spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/h_agent_db
    username: h_agent
    password: h_agent
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: change-this-to-256-bit-secret-change-this
  expiration-seconds: 7200

langfuse:
  enabled: false
  otlp-endpoint: https://cloud.langfuse.com/api/public/otel
  public-key: ""
  secret-key: ""

knowledge:
  retriever:
    max-results: 4
    min-score: 0.6
  split:
    chunk-size: 300
    chunk-overlap: 30
  upload:
    allowed-types:
      - md
      - markdown
      - txt
      - doc
      - docx
      - xls
      - xlsx
