server:
  http2:
    enabled: true
  port: 8081

spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    # 本工作区使用独立 schema，避免与 h-agent / h-agent-ltm 共用 public 时 Flyway 版本互相污染；
    # 保留 public 以便解析 pgvector 扩展类型（vector）
    url: jdbc:postgresql://127.0.0.1:5432/h_agent_db?currentSchema=skill_platform,public
    username: h_agent
    password: h_agent
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 把 MyBatis 日志桥接到当前 logback，参数化 SQL 由 StatementLogger (DEBUG) 打印
    # 带 ? 的 PreparedStatement 与参数列表（Parameters、Updates 换行）会输出到 com.h.backend.mybatis.SqlLog logger
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

jwt:
  secret: change-this-to-256-bit-secret-change-this
  expiration-seconds: 7200

langfuse:
  enabled: false
  otlp-endpoint: https://cloud.langfuse.com/api/public/otel
  public-key: ""
  secret-key: ""

chat:
  harness:
    workspace-template: /tmp/h-agent/harness-workspace
  subagent-catalog:
    # 代码默认关闭（设计 Phase 5 滚动发布要求）；本地开发显式开启。
    enabled: true
  stream:
    heartbeat-interval: 15s
    max-concurrent-per-user: 100
    max-concurrent-global: 100
    permit-ttl: 10m
  resources:
    public-base-url: ""
    upload:
      allowed-mime-types: image/jpeg,image/png,image/webp,video/mp4,audio/mpeg,audio/mp4,audio/wav,audio/webm
      max-file-size: 10485760
  filesystem:
    base-dir: /tmp/h-agent/assistant-files
    max-file-size-bytes: 10485760
  shell:
    enabled: true
    default-timeout-seconds: 30
    max-timeout-seconds: 120
    max-output-bytes: 100000
    inherit-environment: false

# MinIO 资源对象存储（计划 §8.1）：唯一生产 ResourceStorage，无本地回退。
# 必填项经环境变量注入；缺失或非法时启动 fail fast（纯配置校验，不联网探测）。
# secret-key 只经环境变量/Secret 注入，绝不写入仓库、镜像或文档。
resource-storage:
  absolute-max-bytes: 524288000
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:I5PLCKEHQAPAMN9ON3I6}
    secret-key: ${MINIO_SECRET_KEY:isAtBLmBTAYj2KmduHQ1nDGEyNxQZDFYqc5+eEEK}
    region: ${MINIO_REGION:us-east-1}
    bucket: ${MINIO_RESOURCES_BUCKET:huajiang}
    object-prefix: ${MINIO_RESOURCES_PREFIX:h-agent/}
    connect-timeout: 3s
    read-timeout: 60s
    part-size-bytes: 10485760

# Skill 版本平台（设计 docs/superpowers/specs/2026-08-25-skill-git-version-platform-design.md）。
# 制品 Bucket 与 resources 隔离；凭据只经环境变量注入，不写入仓库。
skill-platform:
  repository:
    provider: gitee
    clone-url: https://gitee.com/huajiangliangliang/hj-skill-repo.git
    branch: master
    credential-env: GITEE_TOKEN
    api-base-url: https://gitee.com/api/v5
  artifacts:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_SKILLS_ACCESS_KEY:${MINIO_ACCESS_KEY:I5PLCKEHQAPAMN9ON3I6}}
    secret-key: ${MINIO_SKILLS_SECRET_KEY:${MINIO_SECRET_KEY:isAtBLmBTAYj2KmduHQ1nDGEyNxQZDFYqc5+eEEK}}
    region: ${MINIO_REGION:us-east-1}
    system-bucket: ${MINIO_SYSTEM_SKILLS_BUCKET:h-agent-skills}
    user-bucket: ${MINIO_USER_SKILLS_BUCKET:h-agent-skills}
    system-object-prefix: ${MINIO_SYSTEM_SKILLS_PREFIX:system/}
    user-object-prefix: ${MINIO_USER_SKILLS_PREFIX:user/}
    connect-timeout: 3s
    read-timeout: 60s
  validation:
    max-user-skills: 20
    max-file-bytes: 1048576
    max-total-bytes: 10485760
    max-files: 200
    max-depth: 8
  cache:
    directory: /tmp/h-agent/skill-artifacts
    max-bytes: 524288000
    snapshot-ttl: 5m
  runtime:
    enabled: true

agents:
  a2a:
    other-agents:
      enabled: false
      base-url: http://localhost:8082
  mcp:
    other-agents:
      enabled: false
      url: http://localhost:8082/test1/mcp
      token: ${MCP_TEST1_TOKEN:dev-token-test1}
      tool-execution-timeout-seconds: 4

knowledge:
  retriever:
    max-results: 4
    min-score: 0.6
  split:
    chunk-size: 300
    chunk-overlap: 30
  upload:
    allowed-types:
      - md
      - markdown
      - txt
      - doc
      - docx
      - xls
      - xlsx

voice:
  tts:
    preview-max-text-length: 240
    message-max-text-length: 5000
    minimax:
      base-url: https://api.minimaxi.com
      api-key: ""
      model: speech-2.8-turbo
      voice-id: male-qn-qingse
      format: mp3
      sample-rate: 32000
      bitrate: 128000
      request-timeout-seconds: 60

generation:
  polling:
    enabled: true
    fixed-delay: 20s
    batch-size: 20
    queueing-delay: 10s
    processing-delay: 15s
    retry-delay: 30s
  minimax:
    base-url: https://api.minimaxi.com
    api-key: ${MINIMAX_API_KEY:}
  download:
    max-file-size: 524288000
