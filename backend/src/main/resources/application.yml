server:
  http2:
    enabled: true
  port: 8081

spring:
  application:
    name: backend
  # 支持从仓库根目录或 backend/ 启动。操作系统环境变量的优先级高于 .env。
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://169.254.210.181:5432/h_agent_db?currentSchema=skill_platform,public}
    username: ${DB_USERNAME:h_agent}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:169.254.210.181}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 200
          max-wait: -1ms
          max-idle: 10
          min-idle: 5
        shutdown-timeout: 100ms
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jwt:
  secret: ${JWT_SECRET:}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}

# tianai-captcha 上游配置：init-default-resource=false 由 CaptchaConfiguration 提供 classpath 受信资源。
captcha:
  prefix: h-agent:captcha:answer
  expire:
    default: 120000
    SLIDER: 120000
  init-default-resource: false
  local-cache-enabled: true
  local-cache-size: 20
  local-cache-wait-time: 1000
  local-cache-period: 5000
  secondary:
    enabled: false

# 滑块人机验证（设计 docs/superpowers/specs/2026-09-05-auth-slider-captcha-design.md §5.4）。
# subject-hmac-secret 为独立密钥，不复用 JWT_SECRET；为空时启动失败（fail fast）。
human-verification:
  challenge-metadata-ttl: 120s
  proof-ttl: 90s
  key-prefix: h-agent:human-verification
  subject-hmac-secret: ${CAPTCHA_SUBJECT_HMAC_SECRET:}

agent-observability:
  enabled: auto
  service-name: backend
  langfuse:
    base-url: ${LANGFUSE_BASE_URL:}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    environment: ${LANGFUSE_ENVIRONMENT:local}
  sampling:
    root-ratio: ${LANGFUSE_SAMPLE_RATE:1.0}
  content:
    mode: ${LANGFUSE_CONTENT_MODE:structured}

chat:
  harness:
    workspace-template: /tmp/h-agent/harness-workspace
  subagent-catalog:
    # 功能开关：代码默认关闭，本地开发显式开启。
    enabled: true
  stream:
    heartbeat-interval: 15s
    max-concurrent-per-user: 100
    max-concurrent-global: 100
    permit-ttl: 10m
  resources:
    public-base-url: ""
    upload:
      allowed-mime-types: image/jpeg,image/png,image/webp,video/mp4,audio/mpeg,audio/mp4,audio/wav,audio/webm
      max-file-size: 10485760
  filesystem:
    base-dir: /tmp/h-agent/assistant-files
    max-file-size-bytes: 10485760
  shell:
    enabled: true
    default-timeout-seconds: 30
    max-timeout-seconds: 120
    max-output-bytes: 100000
    inherit-environment: false

# MinIO：优先使用应用专用凭据，同时兼容 MinIO 服务端常用变量名。
resource-storage:
  absolute-max-bytes: 524288000
  minio:
    endpoint: ${MINIO_ENDPOINT:http://169.254.210.181:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_RESOURCES_BUCKET:}
    object-prefix: ${MINIO_RESOURCES_PREFIX:h-agent/}
    connect-timeout: 3s
    read-timeout: 60s
    part-size-bytes: 10485760

# Skill 版本平台：仓库 Token 和制品凭据均来自环境变量或 .env。
skill-platform:
  repository:
    provider: gitee
    clone-url: https://gitee.com/huajiangliangliang/hj-skill-repo.git
    branch: master
    credential-env: GITEE_TOKEN
    api-base-url: https://gitee.com/api/v5
  artifacts:
    endpoint: ${MINIO_ENDPOINT:http://169.254.210.181:9000}
    access-key: ${MINIO_SKILLS_ACCESS_KEY:${MINIO_ACCESS_KEY:}}
    secret-key: ${MINIO_SKILLS_SECRET_KEY:${MINIO_SECRET_KEY:}}
    system-bucket: ${MINIO_SYSTEM_SKILLS_BUCKET:h-agent-skills}
    user-bucket: ${MINIO_USER_SKILLS_BUCKET:h-agent-skills}
    system-object-prefix: ${MINIO_SYSTEM_SKILLS_PREFIX:system/}
    user-object-prefix: ${MINIO_USER_SKILLS_PREFIX:user/}
    connect-timeout: 3s
    read-timeout: 60s
  validation:
    max-user-skills: 20
    max-file-bytes: 1048576
    max-total-bytes: 10485760
    max-files: 200
    max-depth: 8
  cache:
    directory: /tmp/h-agent/skill-artifacts
    max-bytes: 524288000
    snapshot-ttl: 5m
  runtime:
    enabled: true

# 资源存储运行指标（统一 Trace 设计 §10.8）：仅暴露 Prometheus scrape 与 health 所需端点。
# Prometheus 缺失、未抓取或暂时不可用不影响应用启动、资源调用与 readiness。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

agents:
  a2a:
    other-agents:
      enabled: false
      base-url: http://localhost:8082
  mcp:
    other-agents:
      enabled: false
      url: http://localhost:8082/test1/mcp
      token: ${MCP_TEST1_TOKEN:dev-token-test1}
      tool-execution-timeout-seconds: 4

# 长期记忆（LangChain4j + Mem0）：默认关闭，滚动发布。
# enabled=true 时 Mem0 契约字段必须完整（URL/API key/contract version/openapi sha256），否则启动 fail-fast。
memory:
  long-term:
    enabled: true
    mem0:
      base-url: ${MEM0_BASE_URL:http://169.254.210.181:8888}
      # MEM0_BASE_API_KEY 是旧名称，只作兼容回退。
      api-key: ${MEM0_API_KEY:}
      contract-version: ${MEM0_CONTRACT_VERSION:}
      openapi-sha256: ${MEM0_OPENAPI_SHA256:}
      connect-timeout: 5s
    recall:
      response-timeout: 10s
      max-attempts: 1
      top-k-per-scope: 4
      max-total-results: 8
      max-chars: 6000
      circuit-breaker-enabled: true
    capture:
      outbox-enabled: true
      max-attempts: 10
      initial-delay: 5s
      max-delay: 15m
      multiplier: 2.0
      jitter: 0.2
    explicit-mutation:
      response-timeout: 3s
      max-attempts: 2

knowledge:
  retriever:
    max-results: 4
    min-score: 0.6
  split:
    chunk-size: 300
    chunk-overlap: 30
  upload:
    allowed-types:
      - md
      - markdown
      - txt
      - doc
      - docx
      - xls
      - xlsx

voice:
  tts:
    preview-max-text-length: 240
    message-max-text-length: 5000
    minimax:
      base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com}
      api-key: ${MINIMAX_API_KEY:${API_KEY:}}
    model: speech-2.8-turbo
    voice-id: male-qn-qingse
    format: mp3
    sample-rate: 32000
    bitrate: 128000
    request-timeout-seconds: 60

image-generation:
  minimax:
    base-url: ${IMAGE_BASE_URL:https://api.minimaxi.com}
    api-key: ${IMAGE_API_KEY:${MINIMAX_API_KEY:${API_KEY:}}}
    model: ${IMAGE_MODEL_NAME:image-01}
    aspect-ratio: ${IMAGE_ASPECT_RATIO:1:1}
    prompt-optimizer: ${IMAGE_PROMPT_OPTIMIZER:true}
    n: ${IMAGE_COUNT:1}
    request-timeout-seconds: ${IMAGE_REQUEST_TIMEOUT_SECONDS:180}

generation:
  polling:
    enabled: true
    fixed-delay: 20s
    batch-size: 20
    queueing-delay: 10s
    processing-delay: 15s
    retry-delay: 30s
  minimax:
    base-url: ${MINIMAX_BASE_URL:https://api.minimaxi.com}
    api-key: ${MINIMAX_API_KEY:${API_KEY:}}
  download:
    max-file-size: 524288000

automation:
  enabled: ${AUTOMATION_ENABLED:true}
  polling-delay: ${AUTOMATION_POLLING_DELAY:15s}
  dispatch-delay: ${AUTOMATION_DISPATCH_DELAY:5s}
  recovery-delay: ${AUTOMATION_RECOVERY_DELAY:60s}
  batch-size: ${AUTOMATION_BATCH_SIZE:10}
  lease-duration: ${AUTOMATION_LEASE_DURATION:30m}
  execution-timeout: ${AUTOMATION_EXECUTION_TIMEOUT:15m}
  misfire-tolerance: ${AUTOMATION_MISFIRE_TOLERANCE:10m}
  worker-threads: ${AUTOMATION_WORKER_THREADS:4}
  delivery:
    batch-size: ${AUTOMATION_DELIVERY_BATCH_SIZE:10}
    lease-duration: ${AUTOMATION_DELIVERY_LEASE_DURATION:2m}
    polling-delay: ${AUTOMATION_DELIVERY_POLLING_DELAY:10s}
    max-attempts: ${AUTOMATION_DELIVERY_MAX_ATTEMPTS:8}
  xxl-job:
    enabled: ${XXL_JOB_ENABLED:false}
    base-url: ${XXL_JOB_ADMIN_URL:http://127.0.0.1:8080}
    username: ${XXL_JOB_ADMIN_USERNAME:}
    password: ${XXL_JOB_ADMIN_PASSWORD:}
    job-group: ${XXL_JOB_GROUP:3}
    author: ${XXL_JOB_AUTHOR:h-agent}
    executor-handler: ${XXL_JOB_EXECUTOR_HANDLER:automationDispatchHandler}
    connect-timeout: ${XXL_JOB_CONNECT_TIMEOUT:3s}
    read-timeout: ${XXL_JOB_READ_TIMEOUT:8s}
    polling-delay: ${XXL_JOB_POLLING_DELAY:5s}
    lease-duration: ${XXL_JOB_LEASE_DURATION:30s}
    batch-size: ${XXL_JOB_BATCH_SIZE:10}
    executor-app-name: ${XXL_JOB_EXECUTOR_APP_NAME:h-agent-job-executor}
    executor-address: ${XXL_JOB_EXECUTOR_ADDRESS:}
    executor-ip: ${XXL_JOB_EXECUTOR_IP:}
    executor-port: ${XXL_JOB_EXECUTOR_PORT:9999}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
    log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}
    scheduler-zone-id: ${XXL_JOB_SCHEDULER_ZONE_ID:Asia/Shanghai}
